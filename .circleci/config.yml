version: 2.1

functions:
  setup-node: github.com/circleci-functions/setup-node@v0.5.0

jobs:
  test:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup-node:
          with:
            node-version-file: package.json
      - setup-node/install-packages
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Run tests
          command: circleci testsuite run "unit tests"
      - store_test_results:
          path: test-results

workflows:
  build-and-test:
    jobs:
      - test
